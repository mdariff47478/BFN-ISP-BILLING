<!DOCTYPE html>
<html>
<head>
  <title>বিল - BFN ISP Billing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<script src="script.js"></script>
<script>protect();</script>

<div class="topbar">
  <div class="brand"><img class="isp-logo"><span class="isp-name"></span></div>
  <button class="btn btn-red" onclick="logout()">লগআউট</button>
</div>

<div class="layout">
  <div class="sidebar">
    <a href="index.html">📊 ড্যাশবোর্ড</a>
    <a href="customers.html">👥 কাস্টমার</a>
    <a href="bills.html">💳 বিল</a>
    <a href="settings.html">⚙️ সেটিংস</a>
  </div>

  <div class="main">
    <div class="box">
      <h2>💳 মাসিক বিল তৈরি করুন</h2>
      <div class="form-grid">
        <select id="customerId"></select>
        <input id="month" placeholder="মাস যেমন: April 2026">
        <input id="amount" type="number" placeholder="বিল Amount">
        <input id="paidAmount" type="number" placeholder="Paid Amount">
        <select id="billStatus">
          <option value="Unpaid">Unpaid</option>
          <option value="Partial">Partial</option>
          <option value="Paid">Paid</option>
        </select>
      </div>
      <button class="btn" onclick="saveBill()">বিল সেভ করুন</button>
    </div>

    <div class="box">
      <h2>Bill List</h2>
      <select id="filter" onchange="loadBills()">
        <option value="All">সব বিল</option>
        <option value="Paid">Paid</option>
        <option value="Unpaid">Unpaid</option>
        <option value="Partial">Partial</option>
      </select>

      <table>
        <thead>
          <tr>
            <th>কাস্টমার</th><th>মাস</th><th>বিল</th><th>Paid</th><th>Due</th><th>Status</th><th>Print</th>
          </tr>
        </thead>
        <tbody id="billTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
renderCommon();

function loadCustomerSelect(){
  const customers = getCustomers();
  customerId.innerHTML = `<option value="">কাস্টমার সিলেক্ট করুন</option>` +
    customers.map(c=>`<option value="${c.id}">${c.fullName} - ${c.mobile}</option>`).join("");
}

function saveBill(){
  const bills = getBills();
  bills.push({
    id:Date.now(),
    customerId:customerId.value,
    month:month.value,
    amount:Number(amount.value),
    paidAmount:Number(paidAmount.value || 0),
    status:billStatus.value
  });
  saveBills(bills);
  loadBills();
  alert("বিল সেভ হয়েছে ✅");
}

function loadBills(){
  const customers = getCustomers();
  let bills = getBills();
  const f = filter.value;
  if(f !== "All") bills = bills.filter(b=>b.status === f);

  billTable.innerHTML = bills.map(b=>{
    const c = customers.find(x=>x.id == b.customerId) || {};
    const due = Number(b.amount) - Number(b.paidAmount || 0);
    const cls = b.status.toLowerCase();
    return `
      <tr>
        <td>${c.fullName || "N/A"}</td>
        <td>${b.month}</td>
        <td>${money(b.amount)}</td>
        <td>${money(b.paidAmount)}</td>
        <td>${money(due)}</td>
        <td><span class="badge ${cls}">${b.status}</span></td>
        <td><button class="btn btn-blue" onclick="printBill(${b.id})">Print</button></td>
      </tr>
    `;
  }).join("");
}

function printBill(id){
  const bills = getBills();
  const customers = getCustomers();
  const b = bills.find(x=>x.id == id);
  const c = customers.find(x=>x.id == b.customerId) || {};
  const s = getSettings();

  const win = window.open("", "_blank");
  win.document.write(`
    <h2>${s.ispName}</h2>
    <hr>
    <p><b>Customer:</b> ${c.fullName}</p>
    <p><b>Mobile:</b> ${c.mobile}</p>
    <p><b>Month:</b> ${b.month}</p>
    <p><b>Amount:</b> ${money(b.amount)}</p>
    <p><b>Paid:</b> ${money(b.paidAmount)}</p>
    <p><b>Due:</b> ${money(Number(b.amount)-Number(b.paidAmount||0))}</p>
    <p><b>Status:</b> ${b.status}</p>
    <hr>
    <p>bKash: ${s.bkash || "N/A"} | Nagad: ${s.nagad || "N/A"} | Rocket: ${s.rocket || "N/A"}</p>
  `);
  win.print();
}

loadCustomerSelect();
loadBills();
</script>
</body>
</html>
