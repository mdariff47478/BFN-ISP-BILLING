<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bills | BFN ISP Billing Bangladesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="bills">
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-logo">BFN</div><div><h2>BFN ISP</h2><p>Billing Bangladesh</p></div></div>
      <nav class="menu">
        <a href="index.html">📊 ড্যাশবোর্ড</a>
        <a href="customers.html">👥 কাস্টমার</a>
        <a href="add-customer.html">➕ নতুন কাস্টমার</a>
        <a class="active" href="bills.html">💳 বিলিং</a>
        <a href="settings.html">⚙️ সেটিংস</a>
        <button onclick="logout()">🚪 লগআউট</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <div class="search-box">🔎 <input id="billSearch" type="text" placeholder="বিল সার্চ করুন..." /></div>
        <div class="top-actions"><span id="currentDate"></span><span class="bell">🔔</span><span class="profile-chip">👤 Admin</span></div>
      </header>

      <section class="page-head">
        <div><h1>বিলিং ম্যানেজমেন্ট</h1><p>মাসিক বিল তৈরি, পেমেন্ট আপডেট ও ইনভয়েস প্রিন্ট করুন</p></div>
        <button class="btn btn-primary" onclick="generateCurrentMonthBills()">Generate Current Month Bill</button>
      </section>

      <section class="stats-grid mini">
        <div class="stat-card blue"><p>মোট বিল</p><h2 id="billTotal">0</h2></div>
        <div class="stat-card green"><p>Paid</p><h2 id="billPaid">৳0</h2></div>
        <div class="stat-card red"><p>Due</p><h2 id="billDue">৳0</h2></div>
        <div class="stat-card cyan"><p>Partial</p><h2 id="billPartial">0</h2></div>
      </section>

      <section class="panel">
        <div class="filters">
          <button class="pill active" data-bill-filter="All">সব</button>
          <button class="pill" data-bill-filter="Paid">Paid</button>
          <button class="pill" data-bill-filter="Unpaid">Unpaid</button>
          <button class="pill" data-bill-filter="Partial">Partial</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Bill ID</th><th>Customer</th><th>Mobile</th><th>Month</th><th>Amount</th><th>Paid</th><th>Due</th><th>Status</th><th>Action</th>
              </tr>
            </thead>
            <tbody id="billsTable"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="invoicePrint"></div>
  <div id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
