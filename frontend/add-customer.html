<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Customer | BFN ISP Billing Bangladesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="add-customer">
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-logo">BFN</div><div><h2>BFN ISP</h2><p>Billing Bangladesh</p></div></div>
      <nav class="menu">
        <a href="index.html">📊 ড্যাশবোর্ড</a>
        <a href="customers.html">👥 কাস্টমার</a>
        <a class="active" href="add-customer.html">➕ নতুন কাস্টমার</a>
        <a href="bills.html">💳 বিলিং</a>
        <a href="settings.html">⚙️ সেটিংস</a>
        <button onclick="logout()">🚪 লগআউট</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <div class="search-box">🔎 <input type="text" placeholder="সার্চ করুন..." /></div>
        <div class="top-actions"><span id="currentDate"></span><span class="bell">🔔</span><span class="profile-chip">👤 Admin</span></div>
      </header>

      <section class="page-head">
        <div><h1>নতুন কাস্টমার যোগ করুন</h1><p>কাস্টমারের PPPoE / Billing প্রোফাইল তৈরি করুন</p></div>
      </section>

      <section class="panel form-panel">
        <form id="addCustomerForm" class="modern-form">
          <div class="form-grid">
            <label>Full Name<input name="name" type="text" required placeholder="যেমন: Arif Hossain"></label>
            <label>Mobile Number<input name="mobile" type="text" required placeholder="017xxxxxxxx"></label>
            <label class="wide">Address<input name="address" type="text" required placeholder="Dhaka, Bangladesh"></label>
            <label>Package/Profile
              <select name="package" required>
                <option value="">Select Package</option>
                <option>10 Mbps</option>
                <option>20 Mbps</option>
                <option>30 Mbps</option>
                <option>50 Mbps</option>
                <option>Custom</option>
              </select>
            </label>
            <label>Monthly Bill Amount<input name="bill" type="number" required placeholder="800"></label>
            <label>Connection Date<input name="date" type="date" required></label>
            <label>Status
              <select name="status" required>
                <option>Active</option>
                <option>Disabled</option>
              </select>
            </label>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Save Customer</button>
            <a class="btn btn-light" href="customers.html">Cancel</a>
          </div>
        </form>
      </section>
    </main>
  </div>

  <div id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
