<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers | BFN ISP Billing Bangladesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="customers">
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-logo">BFN</div><div><h2>BFN ISP</h2><p>Billing Bangladesh</p></div></div>
      <nav class="menu">
        <a href="index.html">📊 ড্যাশবোর্ড</a>
        <a class="active" href="customers.html">👥 কাস্টমার</a>
        <a href="add-customer.html">➕ নতুন কাস্টমার</a>
        <a href="bills.html">💳 বিলিং</a>
        <a href="settings.html">⚙️ সেটিংস</a>
        <button onclick="logout()">🚪 লগআউট</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <div class="search-box">🔎 <input id="customerSearch" type="text" placeholder="কাস্টমার সার্চ করুন..." /></div>
        <div class="top-actions"><span id="currentDate"></span><span class="bell">🔔</span><span class="profile-chip">👤 Admin</span></div>
      </header>

      <section class="page-head">
        <div><h1>কাস্টমার ম্যানেজমেন্ট</h1><p>সব কাস্টমার দেখুন, এডিট করুন বা স্ট্যাটাস পরিবর্তন করুন</p></div>
        <a href="add-customer.html" class="btn btn-primary">+ Add Customer</a>
      </section>

      <section class="panel">
        <div class="filters">
          <button class="pill active" data-filter="All">সব</button>
          <button class="pill" data-filter="Active">Active</button>
          <button class="pill" data-filter="Disabled">Disabled</button>
        </div>

        <div class="table-wrap desktop-table">
          <table>
            <thead>
              <tr>
                <th>ID</th><th>নাম</th><th>মোবাইল</th><th>ঠিকানা</th><th>প্যাকেজ</th><th>বিল</th><th>স্ট্যাটাস</th><th>তারিখ</th><th>Action</th>
              </tr>
            </thead>
            <tbody id="customersTable"></tbody>
          </table>
        </div>

        <div id="customerMobileCards" class="mobile-cards"></div>
      </section>
    </main>
  </div>

  <div id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
