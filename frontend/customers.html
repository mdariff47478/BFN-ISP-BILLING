<!DOCTYPE html>
<html>
<head>
  <title>কাস্টমার - BFN ISP Billing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<script src="script.js"></script>
<script>protect();</script>

<div class="topbar">
  <div class="brand"><img class="isp-logo"><span class="isp-name"></span></div>
  <button class="btn btn-red" onclick="logout()">লগআউট</button>
</div>

<div class="layout">
  <div class="sidebar">
    <a href="index.html">📊 ড্যাশবোর্ড</a>
    <a href="customers.html">👥 কাস্টমার</a>
    <a href="bills.html">💳 বিল</a>
    <a href="settings.html">⚙️ সেটিংস</a>
    <a href="#" onclick="logout()">🚪 লগআউট</a>
  </div>

  <div class="main">
    <div class="search-row">
      <h2>কাস্টমার লিস্ট</h2>
      <a class="btn" href="add-customer.html">➕ নতুন কাস্টমার</a>
    </div>

    <input id="search" onkeyup="loadCustomers()" placeholder="নাম বা মোবাইল দিয়ে সার্চ করুন">

    <div class="box">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>নাম</th><th>মোবাইল</th><th>ঠিকানা</th><th>প্যাকেজ</th>
            <th>মাসিক বিল</th><th>তারিখ</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th>
          </tr>
        </thead>
        <tbody id="table"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
renderCommon();

function loadCustomers(){
  const q = document.getElementById("search").value.toLowerCase();
  let customers = getCustomers().filter(c =>
    c.fullName.toLowerCase().includes(q) || c.mobile.toLowerCase().includes(q)
  );

  document.getElementById("table").innerHTML = customers.map(c=>`
    <tr>
      <td>${c.id}</td>
      <td>${c.fullName}</td>
      <td>${c.mobile}</td>
      <td>${c.address}</td>
      <td>${c.packageName}</td>
      <td>${money(c.monthlyBill)}</td>
      <td>${c.connectionDate}</td>
      <td><span class="badge ${c.status==="Active"?"active":"disabled"}">${c.status}</span></td>
      <td>
        <a class="btn btn-blue" href="edit-customer.html?id=${c.id}">Edit</a>
        <button class="btn btn-red" onclick="deleteCustomer(${c.id})">Delete</button>
      </td>
    </tr>
  `).join("");
}

function deleteCustomer(id){
  if(confirm("এই কাস্টমার ডিলিট করবেন?")){
    saveCustomers(getCustomers().filter(c=>c.id != id));
    loadCustomers();
  }
}

loadCustomers();
</script>
</body>
</html>
