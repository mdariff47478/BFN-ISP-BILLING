<!DOCTYPE html>
<html>
<head>
  <title>Customers List</title>
</head>
<body>

<script>
  if (!localStorage.getItem("token")) {
    window.location.href = "login.html";
  }
</script>

<h1>All Customers</h1>

<a href="index.html">Add Customer</a>
<button onclick="logout()">Logout</button>
<br><br>

<table border="1">
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Package</th>
      <th>Bill</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="customerTable"></tbody>
</table>

<script>
const API = "https://bfn-isp-billing.onrender.com";

async function loadCustomers() {
  const token = localStorage.getItem("token");

  const res = await fetch(API + "/customers", {
    headers: { "Authorization": "Bearer " + token }
  });

  const data = await res.json();

  let html = "";

  data.forEach(c => {
    html += `
    <tr>
      <td>${c.full_name}</td>
      <td>${c.phone}</td>
      <td>${c.package_name}</td>
      <td>${c.monthly_bill}</td>
      <td>
        <button onclick="editCustomer(${c.id})">Edit</button>
        <button onclick="deleteCustomer(${c.id})">Delete</button>
      </td>
    </tr>
    `;
  });

  document.getElementById("customerTable").innerHTML = html;
}

async function deleteCustomer(id) {
  const token = localStorage.getItem("token");

  if (!confirm("Delete this customer?")) return;

  await fetch(API + "/customers/" + id, {
    method: "DELETE",
    headers: { "Authorization": "Bearer " + token }
  });

  loadCustomers();
}

function editCustomer(id) {
  window.location.href = "edit.html?id=" + id;
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}

loadCustomers();
</script>

</body>
</html>
