<!DOCTYPE html>
<html>
<head>
  <title>Customers - BFN ISP Billing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#111827}
    .topbar{background:#0f172a;color:white;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}
    .brand{font-size:20px;font-weight:bold}
    .logout{background:#ef4444;color:white;border:0;padding:9px 14px;border-radius:8px}
    .layout{display:flex;min-height:100vh}
    .sidebar{width:230px;background:#111827;color:white;padding:18px}
    .sidebar h3{margin-top:0;color:#22c55e}
    .sidebar a{display:block;color:white;text-decoration:none;padding:12px;border-radius:8px;margin:6px 0;background:#1f2937}
    .sidebar a:hover{background:#2563eb}
    .main{flex:1;padding:20px}
    .toolbar{display:flex;gap:10px;margin-bottom:15px}
    .search{flex:1;padding:12px;border:1px solid #cbd5e1;border-radius:8px}
    .addBtn{background:#16a34a;color:white;text-decoration:none;padding:12px 16px;border-radius:8px}
    .table-box{background:white;border-radius:14px;box-shadow:0 4px 12px #d1d5db;overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th{background:#1f2937;color:white;text-align:left;padding:12px}
    td{padding:12px;border-bottom:1px solid #e5e7eb}
    .status{padding:5px 10px;border-radius:20px;background:#dcfce7;color:#166534;font-weight:bold;font-size:13px}
    .edit{background:#2563eb;color:white;border:0;padding:7px 10px;border-radius:6px}
    .delete{background:#ef4444;color:white;border:0;padding:7px 10px;border-radius:6px}
    @media(max-width:800px){
      .layout{display:block}
      .sidebar{width:100%}
    }
  </style>
</head>

<body>

<script>
if (!localStorage.getItem("token")) {
  window.location.href = "login.html";
}
</script>

<div class="topbar">
  <div class="brand">🇧🇩 BFN ISP Billing</div>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="layout">
  <div class="sidebar">
    <h3>Admin Panel</h3>
    <a href="index.html">📊 Dashboard</a>
    <a href="customers.html">👥 Customers</a>
    <a href="#">💳 Bills</a>
    <a href="#">💰 Payments</a>
    <a href="#">📡 MikroTik</a>
    <a href="#">⚙️ Settings</a>
  </div>

  <div class="main">
    <h2>Customers List</h2>

    <div class="toolbar">
      <input class="search" id="searchInput" onkeyup="searchCustomer()" placeholder="Search by name, phone, PPPoE username">
      <a class="addBtn" href="index.html">+ Add Customer</a>
    </div>

    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>PPPoE</th>
            <th>Package</th>
            <th>Bill</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="customerTable"></tbody>
      </table>
    </div>

    <p id="message"></p>
  </div>
</div>

<script>
const API = "https://bfn-isp-billing.onrender.com";
let customers = [];

async function loadCustomers() {
  const token = localStorage.getItem("token");

  const res = await fetch(API + "/customers", {
    headers: { "Authorization": "Bearer " + token }
  });

  const data = await res.json();

  if (!res.ok) {
    document.getElementById("message").innerText = "Error: " + (data.error || "Login again");
    return;
  }

  customers = data;
  showCustomers(customers);
}

function showCustomers(list) {
  let html = "";

  list.forEach(c => {
    html += `
      <tr>
        <td>${c.full_name || ""}</td>
        <td>${c.phone || ""}</td>
        <td>${c.pppoe_username || ""}</td>
        <td>${c.package_name || ""}</td>
        <td>৳${c.monthly_bill || 0}</td>
        <td><span class="status">${c.status || "active"}</span></td>
        <td>
          <button class="edit" onclick="editCustomer(${c.id})">Edit</button>
          <button class="delete" onclick="deleteCustomer(${c.id})">Delete</button>
        </td>
      </tr>
    `;
  });

  document.getElementById("customerTable").innerHTML = html;
}

function searchCustomer() {
  const q = document.getElementById("searchInput").value.toLowerCase();

  const filtered = customers.filter(c =>
    (c.full_name || "").toLowerCase().includes(q) ||
    (c.phone || "").toLowerCase().includes(q) ||
    (c.pppoe_username || "").toLowerCase().includes(q)
  );

  showCustomers(filtered);
}

async function deleteCustomer(id) {
  const token = localStorage.getItem("token");

  if (!confirm("Delete this customer?")) return;

  await fetch(API + "/customers/" + id, {
    method: "DELETE",
    headers: { "Authorization": "Bearer " + token }
  });

  loadCustomers();
}

function editCustomer(id) {
  window.location.href = "edit.html?id=" + id;
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}

loadCustomers();
</script>

</body>
</html>
