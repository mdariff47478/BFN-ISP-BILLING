<!DOCTYPE html>
<html>
<head>
<title>Customers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#eef2f7}
.topbar{background:#0f172a;color:white;padding:15px;display:flex;justify-content:space-between}
.layout{display:flex}
.sidebar{width:220px;background:#111827;color:white;padding:15px}
.sidebar a{display:block;color:white;padding:12px;margin:5px 0;background:#1f2937;text-decoration:none;border-radius:8px}
.main{flex:1;padding:20px}
table{width:100%;background:white;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #eee}
button{padding:6px 10px;border:none;border-radius:6px}
.delete{background:red;color:white}
.edit{background:blue;color:white}
</style>
</head>

<body>

<script>
if(!localStorage.getItem("token")) location.href="login.html";
</script>

<div class="topbar">
<b>🇧🇩 BFN ISP Billing</b>
<button onclick="logout()">Logout</button>
</div>

<div class="layout">

<div class="sidebar">
<a href="index.html">📊 Dashboard</a>
<a href="customers.html">👥 Customers</a>
<a href="bills.html">💳 Bills</a>
<a href="settings.html">⚙️ Settings</a>
</div>

<div class="main">

<h2>Customers</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Package</th>
<th>Bill</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

</div>

<script>
const API="https://bfn-isp-billing.onrender.com";
const token=localStorage.getItem("token");

async function load(){
const res=await fetch(API+"/customers",{headers:{Authorization:"Bearer "+token}});
const data=await res.json();

let html="";
data.forEach(c=>{
html+=`
<tr>
<td>${c.full_name}</td>
<td>${c.phone}</td>
<td>${c.package_name}</td>
<td>${c.monthly_bill}</td>
<td>
<button class="edit" onclick="edit(${c.id})">Edit</button>
<button class="delete" onclick="del(${c.id})">Delete</button>
</td>
</tr>
`;
});

document.getElementById("table").innerHTML=html;
}

function edit(id){
location.href="edit.html?id="+id;
}

async function del(id){
await fetch(API+"/customers/"+id,{
method:"DELETE",
headers:{Authorization:"Bearer "+token}
});
load();
}

function logout(){
localStorage.removeItem("token");
location.href="login.html";
}

load();
</script>

</body>
</html>
