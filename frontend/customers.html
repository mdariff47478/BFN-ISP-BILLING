<!DOCTYPE html>
<html>
<head>
  <title>Customers List</title>
</head>
<body>

<script>
  if (!localStorage.getItem("token")) {
    window.location.href = "login.html";
  }
</script>

<h1>All Customers</h1>

<a href="index.html">Add Customer</a>
<button onclick="logout()">Logout</button>
<br><br>

<table border="1">
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Package</th>
      <th>Bill</th>
    </tr>
  </thead>
  <tbody id="customerTable"></tbody>
</table>

<p id="message"></p>

<script>
const API_URL = "https://bfn-isp-billing.onrender.com";

async function loadCustomers() {
  const token = localStorage.getItem("token");

  const res = await fetch(API_URL + "/customers", {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const data = await res.json();

  if (!res.ok) {
    document.getElementById("message").innerText = "Error: " + (data.error || "Login again");
    return;
  }

  let html = "";

  data.forEach(c => {
    html += `
      <tr>
        <td>${c.full_name}</td>
        <td>${c.phone}</td>
        <td>${c.package_name}</td>
        <td>${c.monthly_bill}</td>
      </tr>
    `;
  });

  document.getElementById("customerTable").innerHTML = html;
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}

loadCustomers();
</script>

</body>
</html>
