<!DOCTYPE html>
<html>
<head>
  <title>সেটিংস - BFN ISP Billing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<script src="script.js"></script>
<script>protect();</script>

<div class="topbar">
  <div class="brand"><img class="isp-logo"><span class="isp-name"></span></div>
  <button class="btn btn-red" onclick="logout()">লগআউট</button>
</div>

<div class="layout">
  <div class="sidebar">
    <a href="index.html">📊 ড্যাশবোর্ড</a>
    <a href="customers.html">👥 কাস্টমার</a>
    <a href="bills.html">💳 বিল</a>
    <a href="settings.html">⚙️ সেটিংস</a>
  </div>

  <div class="main">
    <div class="box">
      <h2>⚙️ ISP সেটিংস</h2>

      <label>ISP Name</label>
      <input id="ispName" placeholder="ISP Name">

      <label>Logo URL</label>
      <input id="logoUrl" placeholder="Logo image URL">

      <label>bKash Number</label>
      <input id="bkash" placeholder="bKash Number">

      <label>Nagad Number</label>
      <input id="nagad" placeholder="Nagad Number">

      <label>Rocket Number</label>
      <input id="rocket" placeholder="Rocket Number">

      <button class="btn" onclick="save()">সেভ করুন</button>
      <p id="msg"></p>
    </div>
  </div>
</div>

<script>
renderCommon();

const s = getSettings();
ispName.value = s.ispName;
logoUrl.value = s.logoUrl;
bkash.value = s.bkash;
nagad.value = s.nagad;
rocket.value = s.rocket;

function save(){
  saveSettings({
    ispName: ispName.value,
    logoUrl: logoUrl.value || DEFAULT_LOGO,
    bkash: bkash.value,
    nagad: nagad.value,
    rocket: rocket.value
  });
  msg.innerText = "সেটিংস সেভ হয়েছে ✅";
  renderCommon();
}
</script>
</body>
</html>
