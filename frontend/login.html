<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | BFN ISP Billing Bangladesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <div class="login-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="login-card animate-pop">
      <div class="login-logo">
        <span>BFN</span>
      </div>

      <h1>BFN ISP Billing Bangladesh</h1>
      <p>স্মার্ট আইএসপি বিলিং ম্যানেজমেন্ট</p>

      <form id="loginForm" class="login-form">
        <div class="input-group">
          <span>👤</span>
          <input type="text" id="loginUsername" placeholder="ইউজারনেম" autocomplete="username" required />
        </div>

        <div class="input-group">
          <span>🔐</span>
          <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড" autocomplete="current-password" required />
        </div>

        <div id="loginError" class="login-error"></div>

        <button type="submit" class="btn btn-primary full">লগইন করুন</button>
      </form>

      <div class="login-demo">
        Demo: <b>admin</b> / <b>1234</b>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
