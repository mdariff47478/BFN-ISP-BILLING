<!DOCTYPE html>
<html>
<head>
  <title>লগইন - BFN ISP Billing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-card">
  <img class="logo isp-logo" src="">
  <h2 class="isp-name">BFN ISP Billing Bangladesh</h2>
  <p>এডমিন লগইন</p>

  <input id="username" placeholder="ইউজারনেম">
  <input id="password" type="password" placeholder="পাসওয়ার্ড">

  <button class="btn btn-blue" onclick="login()">লগইন করুন</button>
  <p id="error" class="msg"></p>
</div>

<script src="script.js"></script>
<script>
renderCommon();

function login(){
  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;

  if(u === "admin" && p === "1234"){
    localStorage.setItem("loggedIn","true");
    window.location.href = "index.html";
  }else{
    document.getElementById("error").innerText = "ভুল ইউজারনেম অথবা পাসওয়ার্ড ❌";
  }
}
</script>
</body>
</html>
