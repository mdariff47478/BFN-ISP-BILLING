<!DOCTYPE html>
<html>
<head>
  <title>Login - BFN ISP Billing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .login-box{
      background:white;
      color:black;
      padding:25px;
      border-radius:16px;
      width:320px;
      box-shadow:0 8px 30px rgba(0,0,0,0.3);
      text-align:center;
    }

    .logo{
      width:90px;
      height:90px;
      border-radius:50%;
      object-fit:cover;
      margin-bottom:10px;
      border:3px solid #2563eb;
    }

    h2{
      margin:10px 0;
    }

    input{
      width:100%;
      padding:12px;
      margin:8px 0;
      border-radius:8px;
      border:1px solid #ccc;
    }

    button{
      width:100%;
      padding:12px;
      background:#2563eb;
      color:white;
      border:none;
      border-radius:8px;
      margin-top:10px;
      font-size:15px;
    }

    .upload{
      margin-top:10px;
      font-size:13px;
      color:#555;
    }
  </style>
</head>

<body>

<div class="login-box">

  <img id="logoPreview" class="logo" src="https://via.placeholder.com/90">

  <input type="file" onchange="loadLogo(event)" class="upload">

  <h2>BFN ISP Billing</h2>

  <input id="user" placeholder="Admin Username">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="msg"></p>

</div>

<script>
const API = "https://bfn-isp-billing.onrender.com";

// 🔥 Logo upload (local storage)
function loadLogo(event) {
  const reader = new FileReader();
  reader.onload = function(){
    document.getElementById("logoPreview").src = reader.result;
    localStorage.setItem("logo", reader.result);
  }
  reader.readAsDataURL(event.target.files[0]);
}

// Load saved logo
const savedLogo = localStorage.getItem("logo");
if (savedLogo) {
  document.getElementById("logoPreview").src = savedLogo;
}

// 🔐 Login
async function login() {
  const res = await fetch(API + "/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: document.getElementById("user").value,
      password: document.getElementById("pass").value
    })
  });

  const data = await res.json();

  if (data.token) {
    localStorage.setItem("token", data.token);
    window.location.href = "index.html";
  } else {
    document.getElementById("msg").innerText = "Login Failed ❌";
  }
}
</script>

</body>
</html>
