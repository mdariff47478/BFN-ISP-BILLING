<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#eef2f7}
.topbar{background:#0f172a;color:white;padding:15px;display:flex;justify-content:space-between}
.layout{display:flex}
.sidebar{width:220px;background:#111827;color:white;padding:15px}
.sidebar a{display:block;color:white;padding:12px;margin:5px 0;background:#1f2937;text-decoration:none;border-radius:8px}
.main{flex:1;padding:20px}
.card{background:white;padding:15px;border-radius:10px;margin:10px 0}
</style>
</head>

<body>

<script>
if(!localStorage.getItem("token")) location.href="login.html";
</script>

<div class="topbar">
<b>🇧🇩 BFN ISP Billing</b>
<button onclick="logout()">Logout</button>
</div>

<div class="layout">

<div class="sidebar">
<a href="index.html">📊 Dashboard</a>
<a href="customers.html">👥 Customers</a>
<a href="bills.html">💳 Bills</a>
<a href="settings.html">⚙️ Settings</a>
</div>

<div class="main">
<h2>Dashboard</h2>

<div class="card">Total Customers: <span id="total">0</span></div>
<div class="card">Monthly Income: ৳<span id="income">0</span></div>

</div>

</div>

<script>
const API="https://bfn-isp-billing.onrender.com";
const token=localStorage.getItem("token");

async function load(){
const res=await fetch(API+"/customers",{headers:{Authorization:"Bearer "+token}});
const data=await res.json();

document.getElementById("total").innerText=data.length;

let income=0;
data.forEach(c=>income+=Number(c.monthly_bill||0));
document.getElementById("income").innerText=income;
}

function logout(){
localStorage.removeItem("token");
location.href="login.html";
}

load();
</script>

</body>
</html>
