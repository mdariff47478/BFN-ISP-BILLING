<!DOCTYPE html>
<html>
<head>
  <title>BFN ISP Billing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }

    .header {
      background: #0f172a;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .nav {
      background: white;
      padding: 12px;
      display: flex;
      gap: 10px;
      justify-content: center;
      box-shadow: 0 2px 8px #ddd;
    }

    .nav a, .nav button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 450px;
      margin: 25px auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 14px #ddd;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 15px;
    }

    #message {
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<script>
  if (!localStorage.getItem("token")) {
    window.location.href = "login.html";
  }
</script>

<div class="header">
  <h1>BFN ISP Billing</h1>
  <p>Customer Billing Management System</p>
</div>

<div class="nav">
  <a href="customers.html">Customers</a>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">
  <h2>Add Customer</h2>

  <input id="full_name" placeholder="Full Name">
  <input id="phone" placeholder="Phone Number">
  <input id="address" placeholder="Address">
  <input id="pppoe_username" placeholder="PPPoE Username">
  <input id="package_name" placeholder="Package Name">
  <input id="monthly_bill" placeholder="Monthly Bill">

  <button onclick="addCustomer()">Add Customer</button>

  <p id="message"></p>
</div>

<script>
const API_URL = "https://bfn-isp-billing.onrender.com";

async function addCustomer() {
  const token = localStorage.getItem("token");

  const customer = {
    full_name: document.getElementById("full_name").value,
    phone: document.getElementById("phone").value,
    address: document.getElementById("address").value,
    pppoe_username: document.getElementById("pppoe_username").value,
    package_name: document.getElementById("package_name").value,
    monthly_bill: Number(document.getElementById("monthly_bill").value)
  };

  const res = await fetch(API_URL + "/customers", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify(customer)
  });

  const data = await res.json();

  if (res.ok) {
    document.getElementById("message").innerText = "Customer added successfully ✅";
  } else {
    document.getElementById("message").innerText = "Error: " + (data.error || "Something went wrong");
  }
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}
</script>

</body>
</html>
