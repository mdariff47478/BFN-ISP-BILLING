<!DOCTYPE html>
<html>
<head>
<title>Edit Customer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#eef2f7}
.topbar{background:#0f172a;color:white;padding:15px;display:flex;justify-content:space-between}
.layout{display:flex}
.sidebar{width:220px;background:#111827;color:white;padding:15px}
.sidebar a{display:block;color:white;padding:12px;margin:5px 0;background:#1f2937;text-decoration:none;border-radius:8px}
.main{flex:1;padding:20px}
input{width:100%;padding:10px;margin:5px 0}
button{padding:10px;background:blue;color:white;border:none}
</style>
</head>

<body>

<script>
if(!localStorage.getItem("token")) location.href="login.html";
</script>

<div class="topbar">
<b>🇧🇩 BFN ISP Billing</b>
<button onclick="logout()">Logout</button>
</div>

<div class="layout">

<div class="sidebar">
<a href="index.html">📊 Dashboard</a>
<a href="customers.html">👥 Customers</a>
<a href="bills.html">💳 Bills</a>
<a href="settings.html">⚙️ Settings</a>
</div>

<div class="main">

<h2>Edit Customer</h2>

<input id="name">
<input id="phone">
<input id="package">
<input id="bill">

<button onclick="update()">Update</button>

</div>

</div>

<script>
const API="https://bfn-isp-billing.onrender.com";
const token=localStorage.getItem("token");
const id=new URLSearchParams(location.search).get("id");

async function load(){
const res=await fetch(API+"/customers",{headers:{Authorization:"Bearer "+token}});
const data=await res.json();
const c=data.find(x=>x.id==id);

document.getElementById("name").value=c.full_name;
document.getElementById("phone").value=c.phone;
document.getElementById("package").value=c.package_name;
document.getElementById("bill").value=c.monthly_bill;
}

async function update(){
await fetch(API+"/customers/"+id,{
method:"PUT",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
full_name:name.value,
phone:phone.value,
package_name:package.value,
monthly_bill:Number(bill.value)
})
});

location.href="customers.html";
}

function logout(){
localStorage.removeItem("token");
location.href="login.html";
}

load();
</script>

</body>
</html>
